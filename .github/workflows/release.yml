name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Test, build, and publish
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0; received: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run smoke tests
        run: ./scripts/test.sh

      - name: Build application
        run: ./scripts/build-app.sh

      - name: Package application and checksum
        id: package
        shell: bash
        run: |
          archive_name="Live-Caption-${RELEASE_TAG}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Live Caption.app" "dist/${archive_name}"
          cd dist
          shasum -a 256 "$archive_name" > "${archive_name}.sha256"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/${ARCHIVE_NAME}" \
            "dist/${ARCHIVE_NAME}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Live Caption ${RELEASE_TAG}" \
            --generate-notes
